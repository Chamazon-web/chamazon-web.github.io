<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamazon</title>
    <link rel="icon" type="image/jpeg" href="assets/images/logo1.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Always-on styles. Each page's own stylesheet is loaded by the router. -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/signin.css">
    <link rel="stylesheet" href="css/membership.css">
</head>
<body>
    <!-- The whole site renders into these two containers. -->
    <div id="app"></div>
    <div id="modal-root"></div>
    <noscript>Chamazon needs JavaScript to run.</noscript>

    <!-- data -->
    <script src="js/data/products.js"></script>
    <!-- core -->
    <script src="js/core/util.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/core/styles.js"></script>
    <script src="js/core/router.js"></script>
    <!-- views -->
    <script src="js/views/layout.js"></script>
    <script src="js/views/home.js"></script>
    <script src="js/views/product.js"></script>
    <script src="js/views/checkout.js"></script>
    <script src="js/views/modals.js"></script>
    <!-- start -->
    <script src="js/app.js"></script>
</body>
</html>
